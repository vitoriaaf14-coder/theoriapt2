<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --d:#0F262D;
  --d2:#09191E;
  --t:#48B8B0;
  --t-dark:#0F6F68;
  --bg:#F4F6F7;
  --b:#E2E8F0;
  --s:#64748B;
  --l-top:#09191E;
  --l-bg:#0F262D;
  --l-card:#13313A;
  --l-border:#1D414B;
  --l-text:#F8FAFC;
  --l-muted:#9FB4BA;
  --l-map-bg:#10303A;
  --l-land:#235868;
  --l-land-stroke:#3F8A99;
  --l-arc:#48B8B0;
  --l-label:#CFE3E6;
  --l-box-bg:#13333D;
}
html.theme-light{
  --l-top:#0F262D;
  --l-bg:#F4F7F8;
  --l-card:#FFFFFF;
  --l-border:#D6E2E6;
  --l-text:#0F262D;
  --l-muted:#475569;
  --l-map-bg:#E8EEF1;
  --l-land:#94B4C4;
  --l-land-stroke:#0F6F68;
  --l-arc:#0F6F68;
  --l-label:#0F262D;
  --l-box-bg:#E6F2F3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,sans-serif;color:#111827;background:var(--bg);margin:0;transition:background .25s,color .25s}
.serif{font-family:'Playfair Display',Georgia,serif}
.card{background:#fff;border:1px solid var(--b);border-radius:16px}
.btn{background:var(--t);color:#09191E;font-weight:600;border-radius:8px;padding:.6rem 1.1rem;cursor:pointer;border:0;transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.ghost-l{border:1px solid var(--l-border);color:var(--l-text);border-radius:8px;padding:.55rem 1.05rem;cursor:pointer;background:transparent;transition:background .15s}
.ghost-l:hover{background:rgba(72,184,176,.1)}
.icon-btn-l{border:1px solid var(--l-border);color:var(--l-text);border-radius:8px;padding:.45rem .6rem;cursor:pointer;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.icon-btn-l:hover{background:rgba(72,184,176,.12)}
.lens{border:1px solid var(--b);background:#fff;border-radius:14px;padding:14px;cursor:pointer;text-align:start;width:100%;position:relative}
.lens.on{background:var(--d);color:#F8FAFC;border-color:var(--d)}
.lens.on small{color:#9fb4ba}
.lens .dot{position:absolute;inset-inline-end:14px;top:16px;width:12px;height:12px;border-radius:50%;border:1px solid var(--b)}
.lens.on .dot{background:var(--t);border-color:var(--t)}
.nav{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:8px;color:#cbd8db;font-size:.875rem;cursor:pointer;background:none;border:0}
.nav.on{background:#1F4466;color:#fff}
.bar{height:6px;background:#E8EDF1;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#1F3A5F;border-radius:9px;transition:width .6s}
.sk{height:8px;background:#E8EDF1;border-radius:9px;margin:22px 0 8px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:var(--d);border-radius:50%;animation:spin .8s linear infinite}
.chip{white-space:nowrap;border:1px solid var(--b);background:#fff;border-radius:99px;padding:6px 12px;font-size:.75rem;cursor:pointer;color:#111827}
.chip.ctx{border-color:var(--t);background:#E6F6F4}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:.8125rem;line-height:1.5}
.th td,.th th{border-bottom:1px solid var(--b);padding:16px;text-align:start;vertical-align:middle}
.hide{display:none!important}
select.lang-l{background:transparent;border:1px solid var(--l-border);color:var(--l-text);border-radius:8px;padding:6px 8px;font-size:.75rem;cursor:pointer}
select.lang-l option{background:#0F262D;color:#F8FAFC}
html.theme-light select.lang-l option{background:#FFFFFF;color:#0F262D}
select.lang-app{background:#fff;border:1px solid var(--b);color:#111827;border-radius:8px;padding:5px 8px;font-size:.75rem;cursor:pointer}
.app-dark{background:#0B1D22;color:#E2E8F0}
.app-dark .card{background:#112A32;border-color:#1E424D;color:#F1F5F9}
.app-dark .topbar-app{background:#0F262D;border-color:#1E424D;color:#CBD5E1}
.app-dark .lens{background:#112A32;border-color:#1E424D;color:#F1F5F9}
.app-dark .lens.on{background:#1F4466;border-color:#48B8B0}
.app-dark .text-slate-500,.app-dark .text-slate-600{color:#94A3B8!important}
.app-dark .text-slate-800{color:#F8FAFC!important}
.app-dark .bg-slate-100,.app-dark .bg-slate-200{background:#1A3B45!important;color:#E2E8F0!important}
.app-dark .th td,.app-dark .th th{border-color:#1E424D}
.app-dark .chip{background:#112A32;border-color:#1E424D;color:#E2E8F0}
.app-dark .chip.ctx{background:#163E42;border-color:#48B8B0}
.app-dark select.lang-app{background:#112A32;border-color:#1E424D;color:#F8FAFC}
.app-dark #inp{background:#0F262D;border-color:#1E424D;color:#F8FAFC}
.app-dark .msg.bg-slate-100{background:#1A3B45!important;color:#F1F5F9}
.app-dark .bar{background:#1A3B45}.app-dark .bar i{background:#48B8B0}
.app-dark .pct{color:#F8FAFC}
.pct{font-variant-numeric:tabular-nums;font-weight:600;color:#0F262D}
.lvl{font-size:.625rem;border-radius:99px;padding:2px 8px;white-space:nowrap}
.lvl.hi{background:#D5F0EC;color:#0B5A54}.lvl.mid{background:#E6ECF1;color:#334155}.lvl.lo{background:#F1F5F9;color:#64748B}
.app-dark .lvl.hi{background:#17504F;color:#BFEFE9}.app-dark .lvl.mid{background:#1A3B45;color:#CBD5E1}.app-dark .lvl.lo{background:#14313A;color:#94A3B8}
#worldMap path,#worldMap circle,#worldMap text{transition:fill .25s,stroke .25s}
.map-grat{fill:none;stroke:var(--l-land-stroke);stroke-width:.5;opacity:.16}
.map-land{fill:var(--l-land);stroke:var(--l-land-stroke);stroke-width:.7;stroke-linejoin:round}
.map-border{fill:none;stroke:var(--l-land-stroke);stroke-width:.4;opacity:.55}
.map-arc path{fill:none;stroke:var(--l-arc);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:5 5;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.map-dot circle{fill:var(--l-arc);stroke:var(--l-map-bg);stroke-width:1.5}
.map-dot .map-pulse{fill:none;stroke:var(--l-arc);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.map-label text{fill:var(--l-label);font-size:11.5px;font-weight:600;paint-order:stroke;stroke:var(--l-map-bg);stroke-width:3px;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.map-arc path,.map-dot .map-pulse{animation:none}}

/* ACCESSIBILITY */
:focus-visible{outline:3px solid #48B8B0;outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:-80px;z-index:100;background:#48B8B0;color:#09191E;font-weight:600;padding:10px 14px;border-radius:8px;font-size:.875rem}
.skip:focus{top:8px}
.ax-top{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.3);color:#E2E8F0;border-radius:99px;padding:2px 10px;cursor:pointer;font-size:.6875rem}
.ax-top:hover{background:rgba(255,255,255,.1)}
.ax-tab{position:fixed;inset-inline-end:0;top:45%;z-index:60;width:44px;height:48px;display:flex;align-items:center;justify-content:center;background:#0F262D;color:#48B8B0;border:2px solid #48B8B0;border-inline-end:0;border-start-start-radius:12px;border-end-start-radius:12px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ax-panel{position:fixed;inset-inline-end:12px;top:50%;transform:translateY(-50%);z-index:61;width:min(300px,calc(100vw - 24px));max-height:92vh;overflow:auto;background:#fff;color:#0F262D;border:1px solid #CBD5E1;border-radius:16px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);font-size:.875rem}
.ax-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ax-head b{flex:1;font-size:1rem}
.ax-x{background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:inherit;padding:2px 8px}
.ax-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ax-size{display:flex;align-items:center;gap:6px}
.ax-size button{min-width:40px;height:36px;border:1px solid #CBD5E1;background:#F8FAFC;color:#0F262D;border-radius:8px;cursor:pointer;font-weight:600}
.ax-size button:disabled{opacity:.4;cursor:default}
.ax-size span{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;font-size:.75rem}
.ax-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;border:1px solid #CBD5E1;background:#F8FAFC;color:#0F262D;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:.875rem}
.ax-btn i{flex:none;width:34px;height:20px;border-radius:99px;background:#CBD5E1;position:relative}
.ax-btn i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.ax-btn[aria-pressed="true"]{background:#0F262D;color:#F8FAFC;border-color:#0F262D}
.ax-btn[aria-pressed="true"] i{background:#48B8B0}
.ax-btn[aria-pressed="true"] i::after{inset-inline-start:16px}
.ax-reset{width:100%;background:none;border:0;color:#0F6F68;font-weight:600;cursor:pointer;padding:8px;font-size:.8125rem;text-decoration:underline}
.ax-note{font-size:.6875rem;color:#64748B;margin-top:4px}

html.a11y-spacing body *{letter-spacing:.05em!important;word-spacing:.14em!important;line-height:1.8!important;font-family:Verdana,Tahoma,Arial,sans-serif!important}

html.a11y-contrast{--l-top:#000;--l-bg:#000;--l-card:#000;--l-border:#fff;--l-text:#fff;--l-muted:#fff;--l-map-bg:#000;--l-land:#3A3A3A;--l-land-stroke:#fff;--l-arc:#FFD400;--l-label:#fff;--l-box-bg:#000;--t:#FFD400;--b:#fff;--bg:#000;--d:#000}

html.a11y-contrast body :is(.chip,.msg,.lvl,.bg-slate-100,.bg-slate-200,[style*="#E8EEF1"],[style*="#E6F6F4"]){outline:1px solid #fff}

html.a11y-contrast body .ax-btn[aria-pressed="true"] i{background:#000!important}
html.a11y-contrast body :is([style*="color:var(--t)"],[style*="color:#0F6F68"],.ax-reset,.ax-tab){color:#FFD400!important}
html.a11y-contrast body .nav.on{background:#000!important;outline:2px solid #FFD400}

html.a11y-contrast body .lens.on .dot{background:#FFD400!important}

html.a11y-contrast body .spin{border-color:#555!important;border-top-color:#FFD400!important}
html.a11y-contrast .map-border{opacity:.9}

/* RESULT ACTIONS + PRINTABLE REPORT */
.res-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative}
.rbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--b);background:#fff;color:#0F262D;border-radius:8px;padding:8px 12px;font-size:.8125rem;font-weight:600;cursor:pointer}
.rbtn:hover{background:#F1F5F9}
.rbtn.pri{background:#0F262D;color:#F8FAFC;border-color:#0F262D}
.rbtn.pri:hover{filter:brightness(1.25);background:#0F262D}
.exp-menu{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--b);border-radius:10px}
.app-dark .rbtn{background:#112A32;border-color:#1E424D;color:#F1F5F9}
.app-dark .rbtn.pri{background:#48B8B0;color:#09191E;border-color:#48B8B0}
.app-dark .exp-menu{border-color:#1E424D}
html.a11y-contrast body .rbtn{background:#000!important}
html.a11y-contrast body .rbtn.pri{background:#FFD400!important;color:#000!important;border-color:#FFD400!important}
#printArea{display:none}
@media print{
  html{font-size:100%!important}
  body>*:not(#printArea){display:none!important}
  html body{background:#fff!important;padding:0}
  html body #printArea{display:block!important;padding:8mm;font-family:Inter,Arial,sans-serif;font-size:11pt}
  html body #printArea,html body #printArea *{color:#000!important;background:#fff!important;border-color:#999!important;letter-spacing:normal!important}
  #printArea h1{font-family:'Playfair Display',Georgia,serif;font-size:20pt;margin:0}
  #printArea h2{font-size:13pt;margin:14pt 0 4pt}
  #printArea .meta{font-size:10pt;margin:2pt 0}
  #printArea table{width:100%;border-collapse:collapse;margin-top:10pt}
  #printArea th,#printArea td{border:1px solid #999;padding:6pt;text-align:start;vertical-align:top;font-size:10pt}
  #printArea .note{font-size:9pt;margin-top:12pt}
}

/* v5: mobile accessibility placement, dialogs, library */
body.chat-open .ax-tab{display:none}
@media (min-width:768px){#app main{padding-inline-end:60px}}
a[onclick]{cursor:pointer}
@media (max-width:767px){
  .ax-tab{display:none}
  select.lang-l{max-width:88px}
  #landing header{padding-inline:14px;gap:8px}
  .inst-bar{position:sticky;top:0;z-index:45}

  .ax-panel{top:44px;transform:none;inset-inline:12px;width:auto;max-height:calc(100vh - 60px)}
}
.dlg{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,25,30,.75);backdrop-filter:blur(4px)}
.dlg-box{position:relative;width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#fff;color:#0F262D;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.35);font-size:.875rem}
.dlg-x{position:absolute;inset-inline-end:12px;top:10px}
.dlg-box h2{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;margin:0 0 4px;padding-inline-end:32px}
.dlg-box h3{font-size:.875rem;font-weight:600;margin:16px 0 8px}

.fld{display:block;margin-bottom:12px;font-size:.8125rem;font-weight:600}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;border:1px solid #CBD5E1;border-radius:8px;padding:9px 10px;font-size:.875rem;font-weight:400;background:#fff;color:#0F262D;font-family:inherit;box-sizing:border-box}
.fld small{font-weight:400;color:#64748B}
.dlg-err{color:#B42318;font-size:.8125rem;min-height:1.2em;margin:0 0 8px}
.dlg-info{background:#E6F6F4;color:#0B5A54;border-radius:8px;padding:8px 10px;font-size:.8125rem;margin:8px 0}
.dlg-note{font-size:.6875rem;color:#64748B;margin-top:12px}
.dlg-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}
.dlg-link{background:none;border:0;color:#0F6F68;font-weight:600;cursor:pointer;text-decoration:underline;font-size:.75rem;padding:0}
.sv{border:1px solid #E2E8F0;border-radius:10px;padding:10px;margin-bottom:8px;font-size:.8125rem;line-height:1.5}
.sv .dlg-row{justify-content:flex-start}
.rbtn:disabled{opacity:.6;cursor:default}
.lens-card{background:var(--l-card);border:1px solid var(--l-border);border-radius:16px;padding:20px}
.pillar{font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t);border:1px solid var(--l-border);border-radius:99px;padding:2px 10px}
.app-dark #glQ{background:#0F262D;border-color:#1E424D;color:#F8FAFC}
html.a11y-contrast body :is(.dlg-box,.fld input,.fld select,.fld textarea,.sv,.dlg-info,.lens-card){background:#000!important}
html.a11y-contrast body :is(.dlg-box,.sv,.dlg-info){outline:1px solid #fff}
html.a11y-contrast body .dlg-tabs button[aria-selected="true"]{border-bottom-color:#FFD400!important}
html.a11y-contrast body :is(.dlg-link,.pillar){color:#FFD400!important}
</style>
</head>
<body>
<a class="skip" onclick="skipTo()" data-i="ax_skip"></a>

<!-- INSTITUTIONAL TOP BAR (UFPB) -->
<div style="background:var(--l-top);color:#E2E8F0;border-bottom:1px solid rgba(255,255,255,.08)" class="inst-bar px-6 py-1.5 text-[0.6875rem] tracking-wide flex items-center justify-between">
  <span class="font-medium opacity-90" data-i="inst">Universidade Federal da Paraíba</span>
  <span class="flex items-center gap-3"><span class="hidden sm:inline opacity-70" data-i="dept_short">Departamento de Relações Internacionais · DRI/UFPB</span><button class="ax-top" onclick="toggleAx()" aria-haspopup="dialog"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="7" r="1.2" fill="currentColor"/><path d="M7 9.8l5 1 5-1M12 10.8v3.7M12 14.5l-2.6 4M12 14.5l2.6 4"/></svg><span data-i="ax_title"></span></button></span>
</div>

<!-- LANDING -->
<div id="landing" style="background:var(--l-bg);color:var(--l-text);min-height:100vh;transition:background .25s,color .25s">
 <header class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4 border-b" style="border-color:var(--l-border)">
  <div class="flex items-center gap-2.5 cursor-pointer" onclick="go('landing')">
    <span class="w-8 h-8 rounded-lg flex items-center justify-center" style="border:1px solid var(--l-border);background:var(--l-box-bg);color:var(--t)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
    </span>
    <span class="serif text-2xl tracking-tight">Theor<span style="color:var(--t)">IA</span></span>
  </div>
  <nav class="hidden md:flex gap-8 text-sm" style="color:var(--l-muted)">
    <a data-i="n_ag" onclick="go('analyze')" class="cursor-pointer hover:opacity-80"></a>
    <a data-i="n_how" onclick="toLenses()" class="cursor-pointer hover:opacity-80"></a>
    <a data-i="n_th" onclick="go('compare')" class="cursor-pointer hover:opacity-80"></a>
    <a data-i="n_about" onclick="openAbout()" class="cursor-pointer hover:opacity-80 font-medium" style="color:var(--t)"></a>
  </nav>
  <div class="flex gap-2 items-center">
    <select class="lang-l" onchange="setLang(this.value)" aria-label="Idioma">
      <option value="pt">🌐 PT · Português</option>

const GLS={"pt": {"anarchy": ["Anarquia internacional", "Ausência de uma autoridade central acima dos Estados. Não significa caos, e sim que cada Estado depende de si mesmo para garantir sua segurança."], "balance": ["Equilíbrio de poder", "Tendência de os Estados se alinharem ou se armarem para impedir que um deles se torne dominante."], "dilemma": ["Dilema de segurança", "Situação em que as medidas de um Estado para se proteger são percebidas como ameaça pelos demais, gerando desconfiança e corrida armamentista."], "interest": ["Interesse nacional", "Conjunto de objetivos que um Estado considera vitais, como sobrevivência, segurança e prosperidade. Para Morgenthau, é definido em termos de poder."], "interdep": ["Interdependência complexa", "Conceito de Keohane e Nye para relações em que os países se conectam por múltiplos canais, sem hierarquia fixa entre os temas e com menor peso da força militar."], "regimes": ["Regimes internacionais", "Conjuntos de princípios, normas, regras e procedimentos de decisão em torno dos quais convergem as expectativas dos atores em uma área temática (Krasner)."], "institutions": ["Instituições internacionais", "Organizações e regras duradouras que reduzem incertezas, facilitam a troca de informações e tornam a cooperação mais estável."], "gains": ["Ganhos absolutos e relativos", "Ganhos absolutos medem o que cada parte obtém; ganhos relativos, quanto uma parte obtém em comparação com a outra. Liberais enfatizam os primeiros; realistas, os segundos."], "hegemony": ["Hegemonia", "Em Gramsci, liderança sustentada pelo consentimento, além da coerção. Nas RI, descreve a ordem em que um Estado ou grupo dominante faz seus interesses serem aceitos como gerais."], "worldsystem": ["Sistema-mundo", "Abordagem de Wallerstein que analisa o capitalismo como um sistema único de divisão internacional do trabalho, e não como a soma de economias nacionais."], "coreperiphery": ["Centro e periferia", "Posições na economia mundial: o centro concentra as atividades de maior valor e a periferia fornece matérias-primas e trabalho barato; a semiperiferia ocupa posição intermediária."], "dependency": ["Teoria da dependência", "Corrente latino-americana segundo a qual o subdesenvolvimento da periferia decorre de sua inserção subordinada na economia mundial, e não de um simples atraso."], "sovereignty": ["Soberania", "Autoridade suprema do Estado sobre seu território e independência em relação aos demais Estados; base da igualdade jurídica entre eles."], "treaty": ["Tratado", "Acordo internacional celebrado por escrito entre Estados e regido pelo direito internacional, qualquer que seja sua denominação (Convenção de Viena, 1969)."], "ratification": ["Ratificação", "Ato pelo qual um Estado confirma, no plano internacional, seu consentimento em obrigar-se por um tratado, em geral após aprovação interna."], "bilateral": ["Acordo bilateral e multilateral", "Bilateral é o acordo entre duas partes; multilateral, entre três ou mais. O acordo do Rio Paraná, entre Brasil e Paraguai, é bilateral."]}, "en": {"anarchy": ["International anarchy", "The absence of a central authority above states. It does not mean chaos, but that each state relies on itself for its security."], "balance": ["Balance of power", "The tendency of states to align or arm themselves to prevent any one of them from becoming dominant."], "dilemma": ["Security dilemma", "A situation in which one state's measures to protect itself are perceived as a threat by others, breeding distrust and arms races."], "interest": ["National interest", "The set of goals a state treats as vital, such as survival, security and prosperity. For Morgenthau, it is defined in terms of power."], "interdep": ["Complex interdependence", "Keohane and Nye's concept for relations in which countries are linked through multiple channels, with no fixed hierarchy of issues and a smaller role for military force."], "regimes": ["International regimes", "Sets of principles, norms, rules and decision-making procedures around which actors' expectations converge in a given issue area (Krasner)."], "institutions": ["International institutions", "Lasting organisations and rules that reduce uncertainty, ease the exchange of information and make cooperation more stable."], "gains": ["Absolute and relative gains", "Absolute gains measure what each party obtains; relative gains, how much one obtains compared with the other. Liberals stress the former; realists, the latter."], "hegemony": ["Hegemony", "In Gramsci, leadership sustained by consent as well as coercion. In IR, it describes an order in which a dominant state or group has its interests accepted as general ones."], "worldsystem": ["World-system", "Wallerstein's approach, which analyses capitalism as a single system of international division of labour rather than a sum of national economies."], "coreperiphery": ["Core and periphery", "Positions in the world economy: the core concentrates higher-value activities and the periphery supplies raw materials and cheap labour; the semi-periphery sits in between."], "dependency": ["Dependency theory", "A Latin American school holding that the periphery's underdevelopment stems from its subordinate place in the world economy, not from mere backwardness."], "sovereignty": ["Sovereignty", "The state's supreme authority over its territory and its independence from other states; the basis of their legal equality."], "treaty": ["Treaty", "An international agreement concluded in writing between states and governed by international law, whatever its designation (Vienna Convention, 1969)."], "ratification": ["Ratification", "The act by which a state confirms, at the international level, its consent to be bound by a treaty, usually after domestic approval."], "bilateral": ["Bilateral and multilateral agreement", "A bilateral agreement has two parties; a multilateral one has three or more. The Paraná River agreement between Brazil and Paraguay is bilateral."]}, "es": {"anarchy": ntro y periferia", "Posiciones en la economía mundial: el centro concentra las actividades de mayor valor y la periferia aporta materias primas y trabajo barato; la semiperiferia ocupa una posición intermedia."], "dependency": ["Teoría de la dependencia", "Corriente latinoamericana según la cual el subdesarrollo de la periferia se debe a su inserción subordinada en la economía mundial, y no a un simple atraso."], "sovereignty": ["Soberanía", "Autoridad suprema del Estado sobre su territorio e independencia respecto de los demás Estados; base de la igualdad jurídica entre ellos."], "treaty": ["Tratado", "Acuerdo internacional celebrado por escrito entre Estados y regido por el derecho internacional, cualquiera que sea su denominación (Convención de Viena, 1969)."], "ratification": ["Ratificación", "Acto por el cual un Estado confirma, en el plano internacional, su consentimiento en obligarse por un tratado, por lo general tras la aprobación interna."], "bilateral": ["Acuerdo bilateral y multilateral", "Bilateral es el acuerdo entre dos partes; multilateral, entre tres o más. El acuerdo del Río Paraná, entre Brasil y Paraguay, es bilateral."]}, "fr": {"anarchy": ["Anarchie internationale", "Absence d'autorité centrale au-dessus des États. Elle ne signifie pas le chaos, mais que chaque État ne peut compter que sur lui-même pour sa sécurité."], "balance": ["Équilibre des puissances", "Tendance des États à s'allier ou à s'armer pour empêcher que l'un d'eux ne devienne dominant."], "dilemma": ["Dilemme de sécurité", "Situation où les mesures prises par un État pour se protéger sont perçues comme une menace par les autres, ce qui nourrit la méfiance et la course aux armements."], "interest": ["Intérêt national", "Ensemble des objectifs qu'un État juge vitaux, comme la survie, la sécurité et la prospérité. Pour Morgenthau, il se définit en termes de puissance."], "interdep": ["Interdépendance complexe", "Concept de Keohane et Nye désignant des relations où les pays sont reliés par de multiples canaux, sans hiérarchie fixe entre les enjeux et avec un rôle réduit de la force militaire."], "regimes": ["Régimes internationaux", "Ensembles de principes, de normes, de règles et de procédures de décision autour desquels convergent les attentes des acteurs dans un domaine donné (Krasner)."], "institutions": ["Institutions internationales", "Organisations et règles durables qui réduisent l'incertitude, facilitent l'échange d'informations et rendent la coopération plus stable."], "gains": ["Gains absolus et relatifs", "Les gains absolus mesurent ce que chaque partie obtient ; les gains relatifs, ce qu'une partie obtient par rapport à l'autre. Les libéraux insistent sur les premiers, les réalistes sur les seconds."], "hegemony": ["Hégémonie", "Chez Gramsci, direction fondée sur le consentement autant que sur la coercition. En RI, elle décrit l'ordre dans lequel un État ou un groupe dominant fait accepter ses intérêts comme généraux."], "worldsystem": ["Système-monde", "Approche de Wallerstein qui analyse le capitalisme comme un système unique de division internationale du travail, et non comme une somme d'économies nationales."], "coreperiphery": ["Centre et périphérie", "Positions dans l'économie mondiale : le centre concentre les activités à plus forte valeur et la périphérie fournit matières premières et main-d'œuvre bon marché ; la semi-périphérie occupe une position intermédiaire."], "dependency": ["Théorie de la dépendance", "Courant latino-américain selon lequel le sous-développement de la périphérie résulte de son insertion subordonnée dans l'économie mondiale, et non d'un simple retard."], "sovereignty": ["Souveraineté", "Autorité suprême de l'État sur son territoire et indépendance à l'égard des autres États ; fondement de leur égalité juridique."], "treaty": ["Traité", "Accord international conclu par écrit entre États et régi par le droit international, quelle que soit sa dénomination (Convention de Vienne, 1969)."], "ratification": ["Ratification", "Acte par lequel un État confirme, sur le plan international, son consentement à être lié par un traité, généralement après approbation interne."], "bilateral": ["Accord bilatéral et multilatéral", "Un accord bilatéral lie deux parties ; un accord multilatéral, trois ou plus. L'accord du fleuve Paraná, entre le Brésil et le Paraguay, est bilatéral."]}, "ru": {"anarchy": ["Международная анархия", "Отсутствие центральной власти над государствами. Это не хаос, а положение, при котором каждое государство само отвечает за свою безопасность."], "balance": ["Баланс сил", "Стремление государств объединяться или вооружаться, чтобы не допустить доминирования одного из них."], "dilemma": ["Дилемма безопасности", "Ситуация, когда меры одного государства по самозащите воспринимаются другими как угроза, что порождает недоверие и гонку вооружений."], "interest": ["Национальный интерес", "Совокупность целей, которые государство считает жизненно важными: выживание, безопасность, благосостояние. У Моргентау он определяется в терминах силы."], "interdep": ["Комплексная взаимозависимость", "Понятие Кеохейна и Ная для отношений, в которых страны связаны множеством каналов, нет жёсткой иерархии вопросов, а роль военной силы снижена."], "regimes": ["Международные режимы", "Наборы принципов, норм, правил и процедур принятия решений, вокруг которых сходятся ожидания акторов в определённой сфере (Краснер)."], "institutions": ["Международные институты", "Устойчивые организации и правила, которые снижают неопределённость, облегчают обмен информацией и делают сотрудничество стабильнее."], "gains": ["Абсолютные и относительные выгоды", "Абсолютные выгоды показывают, что получает каждая сторона; относительные — сколько получает одна по сравнению с другой. Либералы подчёркивают первые, реалисты — вторые."], "hegemony": ["Гегемония", "У Грамши — лидерство, опирающееся не только на принуждение, но и на согласие. В МО описывает порядок, при котором господствующее государство или группа добивается признания своих интересов всеобщими."], "worldsystem": ["Мир-система", "Подход Валлерстайна, рассматривающий капитализм как единую систему международного разделения труда, а не как сумму национальных экономик."], "coreperiphery": ["Центр и периферия", "Позиции в мировой экономике: центр сосредоточивает виды деятельности с высокой добавленной стоимостью, периферия поставляет сырьё и дешёвый труд; полупериферия занимает промежуточное положение."], "dependency": ["Теория зависимости", "Латиноамериканская школа, согласно которой отсталость периферии вызвана её подчинённым положением в мировой экономике, а не простым запаздыванием."], "sovereignty": ["Суверенитет", "Верховная власть государства на своей территории и независимость от других государств; основа их юридического равенства."], "treaty": ["Международный договор", "Международное соглашение, заключённое между государствами в письменной форме и регулируемое международным правом, независимо от его наименования (Венская конвенция 1969 г.)."], "ratification": ["Ратификация", "Акт, которым государство на международном уровне подтверждает согласие на обязательность для него договора, обычно после внутреннего одобрения."], "bilateral": ["Двусторонний и многосторонний договор", "Двусторонний договор заключают две стороны, многосторонний — три и более. Договор по реке Парана между Бразилией и Парагваем — двусторонний."]}, "zh": {"anarchy": ["国际无政府状态", "指国家之上不存在中央权威。它并不意味着混乱，而是指各国只能依靠自身来保障安全。"], "balance": ["均势", "各国通过结盟或加强军备来防止某一国取得支配地位的倾向。"], "dilemma": ["安全困境", "一国为自保而采取的措施被他国视为威胁，从而引发不信任和军备竞赛的局面。"], "interest": ["国家利益", "一国视为至关重要的目标，如生存、安全与繁荣。摩根索认为国家利益以权力来界定。"], "interdep": ["复合相互依存", "基欧汉和奈提出的概念，指国家之间通过多种渠道相互联系、议题之间没有固定等级、军事力量作用下降的关系。"], "regimes": ["国际机制", "在特定议题领域中，行为体的预期所汇聚的一整套原则、规范、规则和决策程序（克拉斯纳）。"], "institutions": ["国际制度", "能够降低不确定性、促进信息交流并使合作更加稳定的持久性组织与规则。"], "gains": ["绝对收益与相对收益", "绝对收益衡量各方自身所得；相对收益衡量一方相对于另一方的所得。自由主义强调前者，现实主义强调后者。"], "hegemony": ["霸权", "在葛兰西那里，指除强制之外还以同意为基础的领导权。在国际关系中，指主导国家或集团使自身利 طراف", "مواقع في الاقتصاد العالمي: المركز يتركز فيه النشاط الأعلى قيمة، والأطراف تورّد المواد الخام والعمل الرخيص؛ وشبه الأطراف في موقع وسط."], "dependency": ["نظرية التبعية", "تيار أمريكي لاتيني يرى أن تخلف الأطراف ناتج عن اندماجها التابع في الاقتصاد العالمي، لا عن مجرد تأخر."], "sovereignty": ["السيادة", "السلطة العليا للدولة على إقليمها واستقلالها عن الدول الأخرى؛ وهي أساس المساواة القانونية بينها."], "treaty": ["المعاهدة", "اتفاق دولي يُعقد كتابةً بين الدول ويخضع للقانون الدولي، أياً كانت تسميته (اتفاقية فيينا، 1969)."], "ratification": ["التصديق", "الإجراء الذي تؤكد به الدولة على الصعيد الدولي رضاها بالالتزام بمعاهدة، عادةً بعد الموافقة الداخلية."], "bilateral": ["الاتفاق الثنائي والمتعدد الأطراف", "الاتفاق الثنائي يُعقد بين طرفين، والمتعدد الأطراف بين ثلاثة أو أكثر. واتفاقية نهر بارانا بين البرازيل وباراغواي اتفاق ثنائي."]}};

let glQuery="",glCat="all";
const norm=x=>x.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function renderGl(keepCats){
  if(!$("glList"))return;
  const G=t("gl"),catName={all:t("lb_all"),real:t("l_real"),lib:t("l_lib"),marx:t("l_marx"),law:t("lb_law")};
  if(!keepCats)$("glCats").innerHTML=Object.keys(catName).map(c=>`<button class="chip ${c===glCat?"ctx":""}" aria-pressed="${c===glCat}" onclick="glCat='${c}';renderGl()">${catName[c]}</button>`).join("");
  const q=norm(glQuery.trim());
  const items=GL_ORDER.filter(([k,c])=>(glCat==="all"||c===glCat)&&(!q||norm(G[k][0]+" "+G[k][1]).includes(q))).sort((a,b)=>G[a[0]][0].localeCompare(G[b[0]][0],lang));
  $("glList").innerHTML=items.length?items.map(([k,c])=>`<div class="card p-4"><div class="flex justify-between items-start gap-2"><b class="serif text-lg">${G[k][0]}</b><span class="lvl mid">${catName[c]}</span></div><p class="text-sm text-slate-600 mt-2 leading-relaxed">${G[k][1]}</p></div>`).join(""):`<p class="text-sm text-slate-500">${t("lb_none")}</p>`;
}

  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

async function hashPw(salt,pw){
  const str=salt+"|"+pw;
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
  let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return "x"+h.toString(16);
}

async function authSubmit(e){
  e.preventDefault();
  const su=dlgMode==="signup",email=$("auEmail").value.trim().toLowerCase(),pass=$("auPass").value,name=su?$("auName").value.trim():"";
  if(su&&!name)return dlgError("au_err_name");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return dlgError("au_err_email");
  if(su){
    if(pass.length<6)return dlgError("au_err_pass");
    if(users[email])return dlgError("au_err_exists");
    const salt=Array.from({length:16},()=>Math.floor(Math.random()*16).toString(16)).join("");
    users[email]={name,salt,hash:await hashPw(salt,pass),saved:[]};
  }else{
    const u=users[email];
    if(!u||(await hashPw(u.salt,pass))!==u.hash)return dlgError("au_err_bad");
  }
  sessionEmail=email;store.set("theoria_users",users);store.set("theoria_session",sessionEmail);
  const save=pendingSave;closeDlg();updateAuthUI();
  if(save)doSave();
  renderAll();
}
function logout(){sessionEmail=null;store.set("theoria_session",null);closeDlg();updateAuthUI();renderAll()}

function doSave(){
  const u=me();if(!u||doc!=="ready")return;stamp();if(isSaved())return;
  u.saved.unshift({id:Date.now(),lens,run:RUN[lens],vals:VAL[lens].slice(),at:STAMP[lens].toISOString()});

function delSaved(id){const u=me();if(!u)return;u.saved=u.saved.filter(a=>a.id!==id);store.set("theoria_users",users);renderDlg();renderAll()}

}

const ALL=["diff","capital","interdep","who","bars","replace","power","coop","method"];
function renderChips(){
  const ctx={real:"power",lib:"coop",marx:"capital"}[lens];
  const order=[ctx,...ALL.filter(k=>k!==ctx)];
  $("chips").innerHTML=order.map(k=>`<button class="chip ${k===ctx?"ctx":""}" onclick="ask('${k}')">${k===ctx?"★ ":""}${t("q")[k]}</button>`).join("");
}
function paint(){$("msgs").innerHTML=msgs.map(m=>`<div class="flex ${m.u?"justify-end":""}"><div class="msg ${m.u?"text-white":"bg-slate-100"}" style="${m.u?"background:#1F3A5F":""}">${m.h}</div></div>`).join("");$("msgs").scrollTop=1e5}
function greet(){msgs=[{h:t("hello")}];paint()}
function ask(k){msgs.push({u:1,h:t("q")[k]});paint();reply(k)}
function reply(k){setTimeout(()=>{msgs.push({h:k?t("a")[k]:t("fb")});paint()},450)}
function send(){
  const v=$("inp").value.trim();if(!v)return;$("inp").value="";
  msgs.push({u:1,h:v.replace(/</g,"&lt;")});paint();
  const s=v.toLowerCase(),hit=KW.find(x=>x[1].test(s));reply(hit?hit[0]:null)
}
function toggleChat(){chatOpen=!chatOpen;$("chatWin").classList.toggle("hide",!chatOpen);document.body.classList.toggle("chat-open",chatOpen)}
function openChat(k){if(!chatOpen)toggleChat();if(k&&T[lang].a[k])ask(k)}

drawTheo();
updateThemeIcons();
applyI18n();
greet();
renderAll();
view("analyze");
go("landing",true);
try{history.replaceState({v:"landing"},"")}catch(e){}
axKeyboard();
</script>
